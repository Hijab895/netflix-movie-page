<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Movie Page</title>
</head>
<body>
    <header><nav>
        <a href="#"><img src="assets/images/netflix-logo.png" alt="Netflix Logo"></a>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">TV Shows</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="#">New & Popular</a></li>
            <li><a href="#">My List</a></li>
            <li><a href="#">Search</a></li>
            <li><img src="assets/images/notification-icon.png" alt="Notification"></li>
            <li><img src="assets/images/profile-icon.jpg" alt="Profile"></li>
        </ul>
        
    </nav></header>
    <main>
        <section id="Hero-section">
            <img src="assets/images/hero-banner.webp" alt="Hero-banner">
            <div class="Hero-content">
                <h1>Interstellar</h1>
                <ul>
                    <li>⭐ 8.7</li>
                    <li>2014</li>
                    <li>PG-13</li>
                    <li>2h 49m</li>
                </ul>
                <p>Sci-Fi • Adventure • Drama</p>
                <p>A team of explorers travel through a wormhole in space
                in an attempt to ensure humanity's survival.</p>
                <button>▶ Play</button>
                <button>🎬 Watch Trailer</button>
            </div>
        </section>
    </main>
</body>
</html>
